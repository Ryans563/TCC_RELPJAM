<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login RELPJAM</title>

    <link rel="stylesheet" href="public/assets/css/stylecad.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    
    <!-- Configuração Google -->
    <div id="g_id_onload"
        data-client_id="1031512207739-kjbkgmifm6jf00hagq6vnevrn4vqel2f.apps.googleusercontent.com"
        data-callback="handleCredentialResponse">
    </div>

    <div class="container" id="container">

        <!-- Cadastro -->
        <div class="form-container sign-up-container">
            <form id="signupForm">

                <h1>Criar Conta</h1>

                <div class="social-icons">

                    <div class="g_id_signin"
                        data-type="fa-brands fa-google-g"
                        data-shape="circle"
                        data-theme="outline">
                    </div>

                    <a href="javascript:void(0)" class="icon">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="javascript:void(0)" class="icon">
                        <i class="fa-brands fa-github"></i>
                    </a>

                    <a href="javascript:void(0)" class="icon">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                </div>

                <span>ou use seu e-mail para cadastro</span>

                <input type="text" id="signupName" placeholder="Nome" required>

                <input type="email" id="signupEmail" placeholder="E-mail" required>

                <input type="password" id="signupPassword" placeholder="Senha" required>

                <button type="submit">Cadastrar</button>

            </form>
        </div>

        <!-- Login -->
        <div class="form-container sign-in-container">
            <form id="loginForm">

                <h1>Entrar</h1>

                <div class="social-icons">

                    <div class="g_id_signin"
                        data-type="fa-brands fa-google-g"
                        data-shape="circle"
                        data-theme="outline">
                    </div>

                    <a href="javascript:void(0)" class="icon">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="javascript:void(0)" class="icon">
                        <i class="fa-brands fa-github"></i>
                    </a>

                    <a href="javascript:void(0)" class="icon">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                </div>

                <span>ou use seu e-mail</span>

                <input type="email" id="loginEmail" placeholder="E-mail" required>

                <input type="password" id="loginPassword" placeholder="Senha" required>

                <a href="#">Esqueceu sua senha?</a>

                <button type="submit">Entrar</button>

            </form>
        </div>

        <!-- Painel lateral -->
        <div class="toggle-container">

            <div class="toggle">

                <div class="toggle-panel toggle-left">
                    <h1>Olá!</h1>

                    <p>Faça login para acessar sua conta.</p>

                    <button class="hidden" id="login">
                        Entrar
                    </button>
                </div>

                <div class="toggle-panel toggle-right">
                    <h1>Bem-vindo!</h1>

                    <p>Cadastre-se para começar.</p>

                    <button class="hidden" id="register">
                        Cadastrar
                    </button>
                </div>

            </div>

        </div>

    </div>

    <script src="public/assets/js/scriptcad.js"></script>

</body>

</html>
